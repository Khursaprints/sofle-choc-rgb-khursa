CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=4096
# Disable built-in widgets to avoid conflicts
# CONFIG_ZMK_WIDGET_LAYER_STATUS is not set
# CONFIG_ZMK_WIDGET_BATTERY_STATUS is not set
# CONFIG_ZMK_WIDGET_OUTPUT_STATUS is not set
# CONFIG_ZMK_WIDGET_WPM_STATUS is not set
# CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE is not set

# Encoder support
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Additional options
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
# PHY 2M: DESACTIVADO a proposito, como en v1.6.0 y como en el MX.
#
# EXPERIMENTAL_CONN solo hace una cosa en ZMK v0.3: poner BT_CTLR_PHY_2M a
# n "para mejorar la estabilidad de conexion" (app/Kconfig). La v1.6.1 lo
# forzo a y, y desde entonces las dos mitades emparejan mal: con 2M en
# ambas, Zephyr (BT_AUTO_PHY_UPDATE) sube tambien a 2 Mbps el enlace ENTRE
# mitades, que pierde unos 6 dB de sensibilidad. Lo unico que cambio de
# v1.6.0 a v1.6.1 fue esto y los parametros de conexion de abajo, y esos
# son los mismos que lleva el MX, que empareja bien.
CONFIG_BT_CTLR_PHY_2M=n

# BLE connection preferences. Latency 0 prevents the peripheral from
# skipping connection events, to test whether that reduces key-release lag.
# The host may negotiate different parameters. This can increase idle power
# consumption; evaluate battery life after testing responsiveness.
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=500

# ZMK v0.3 changed the default from y to n (for clones without an HV inductor).
# Without the high-voltage DCDC, VCC comes from the internal LDO and cannot
# power the 30 LEDs reliably.
CONFIG_BOARD_ENABLE_DCDC_HV=y

# RGB FX (replaces ZMK's stock underglow, which only has 4 effects).
# The underglow config activated SPI/LED_STRIP; enable them here explicitly.
CONFIG_ZMK_RGB_UNDERGLOW=n
CONFIG_SPI=y
CONFIG_LED_STRIP=y
CONFIG_WS2812_STRIP=y
CONFIG_ZMK_RGB_FX=y
# Peripheral OLED animations switchable at runtime (&oledanim,
# fork codekeeb/zmk-nice-oled selectable branch). On both halves the
# behavior has global locality.
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_SELECTABLE=y
# Battery as a graphic icon with fill (instead of the % number), both OLEDs.
CONFIG_NICE_OLED_WIDGET_BATTERY_GRAPHIC=y

# Pointing/mouse HID: needed for the &mwheel behavior (discrete scroll
# wheel on the encoders). Adds the mouse report to the HID descriptor, so
# the host may need re-pairing over BLE after this change.
CONFIG_ZMK_POINTING=y

# RGB auto-off: after 5 minutes idle the effects stop and the strip turns
# off. Key activity turns them back on (handled in src/rgb_fx.c).
CONFIG_ZMK_IDLE_TIMEOUT=300000

# Deep sleep after 30 minutes of inactivity, with the delay kept in flash.
# Any key wakes the keyboard. This is unrelated to ZMK_IDLE_TIMEOUT above,
# which only stops the RGB effects.
#
# ZMK_SLEEP stays OFF on purpose: it does the same job, but its delay is
# CONFIG_IDLE_SLEEP_TIMEOUT, an int baked into the binary, so changing
# the minutes would mean rebuilding and reflashing both halves. The count
# is kept by src/codekeeb_sleep.c using the value in flash. Setting it
# explicitly also stops a stray default from enabling a second timer that
# would race this one.
CONFIG_CODEKEEB_SLEEP=y
CONFIG_ZMK_SLEEP=n
